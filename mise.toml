[tools]
uv = "0.12.17"
bun = "1.4.2"

[tasks.prepare]
description = "Installe les dépendances Python (uv) puis JS (bun) après un clone"
run = ["uv sync", "bun install"]

[tasks.tp1]
description = "Démarre le serveur de dev du TP1 (perceptron)"
run = "bun run dev"

[tasks.tp2-train]
description = "Entraîne le MLP du TP2 sur MNIST et exporte le modèle ONNX"
run = "uv run tp2/main.py"
# L'exporteur ONNX de torch affiche des emojis, incompatibles avec cp1252 sous Windows.
env = { PYTHONIOENCODING = "utf-8" }

[tasks.tp2]
description = "Démarre le serveur de dev du TP2 (reconnaissance de chiffres)"
run = "bun run tp2:dev"

[tasks.tp3-train]
description = "Entraîne le CNN du TP3 sur MNIST et exporte le modèle ONNX"
run = "uv run tp3/main.py"
# L'exporteur ONNX de torch affiche des emojis, incompatibles avec cp1252 sous Windows.
env = { PYTHONIOENCODING = "utf-8" }

[tasks.tp4-data]
description = "Génère les tickets bruts du TP4, puis les analyse et les nettoie"
run = ["uv run tp4/generate_data.py", "uv run tp4/analyse.py"]
env = { PYTHONIOENCODING = "utf-8" }

[tasks.tp4-train]
description = "Entraîne le RNN du TP4 (options : --window, --cell, --hidden, --epochs, --lr)"
run = "uv run tp4/train.py"
env = { PYTHONIOENCODING = "utf-8" }

[tasks.tp4]
description = "Démarre le serveur de dev du TP4 (prévision des tickets)"
run = "bun run tp4:dev"

[tasks.tp5-train]
description = "Entraîne le VAE débruiteur du TP5 (options : --epochs, --batch, --lr, --latent, --beta)"
run = "uv run tp5/train.py"
env = { PYTHONIOENCODING = "utf-8" }

[tasks.tp5]
description = "Démarre le serveur de dev du TP5 (débruitage de chiffres dessinés)"
run = "bun run tp5:dev"

[tasks.tp6-train]
description = "Entraîne le VAE à latent 2D du TP6 (options : --epochs, --batch, --lr, --beta, --seed)"
run = "uv run tp6/train.py"
env = { PYTHONIOENCODING = "utf-8" }

[tasks.tp6]
description = "Démarre le serveur de dev du TP6 (exploration de l'espace latent)"
run = "bun run tp6:dev"

[tasks.tp7-train]
description = "Entraîne le GAN du TP7 (options : --epochs, --batch, --lr, --latent, --seed)"
run = "uv run tp7/train.py"
env = { PYTHONIOENCODING = "utf-8" }

[tasks.tp7]
description = "Démarre le serveur de dev du TP7 (génération de chiffres par un GAN)"
run = "bun run tp7:dev"

[tasks.tp8]
description = "Démarre le serveur de dev du TP8 (Q-learning dans un labyrinthe)"
run = "bun run tp8:dev"
